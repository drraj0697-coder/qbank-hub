# Save as: .github/workflows/sync-upstream.yml
name: Sync upstream
on:
  schedule: [{ cron: "0 3 * * *" }]   # every day, 03:00 UTC
  workflow_dispatch:                   # manual "Run workflow" button
permissions:
  contents: write
  pull-requests: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Merge upstream, then re-apply customisations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git remote add upstream https://github.com/amrenkhan07-pixel/qbank-hub.git
          git fetch upstream
          UP=$(git remote show upstream | sed -n 's/.*HEAD branch: //p')
          if git merge "upstream/$UP" --no-edit --allow-unrelated-histories; then
            bash custom/apply.sh
            git add -A
            git diff --cached --quiet || git commit -m "Re-apply customisations"
            git push origin HEAD:main
          else
            git merge --abort
            git checkout -b upstream-update
            git merge "upstream/$UP" -X theirs --no-edit --allow-unrelated-histories
            bash custom/apply.sh
            git add -A
            git diff --cached --quiet || git commit -m "Upstream update (please review)"
            git push -f origin upstream-update
            gh pr create --fill --base main --head upstream-update || true
          fi
