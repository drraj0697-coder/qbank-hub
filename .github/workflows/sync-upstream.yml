name: Sync upstream
on:
  schedule: [{ cron: "0 3 * * *" }]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Merge upstream and re-apply customisations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git remote add upstream https://github.com/ORIGINAL-OWNER/ORIGINAL-REPO.git
          git fetch upstream
          if git merge upstream/main --no-edit --allow-unrelated-histories; then
            [ -f custom/apply.sh ] && bash custom/apply.sh
            git add -A
            git diff --cached --quiet || git commit -m "Re-apply customisations"
            git push origin HEAD:main
          else
            git merge --abort
            git checkout -b upstream-update
            git merge upstream/main -X theirs --no-edit --allow-unrelated-histories
            [ -f custom/apply.sh ] && bash custom/apply.sh
            git add -A && git commit -m "Upstream update (needs review)" || true
            git push -f origin upstream-update
            gh pr create --fill --base main --head upstream-update || true
          fi
